<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Editor | yadsid.com</title>

    <script src="/lib/motion.js"></script>
    <style>
        :root {
            --bg: #000000;
            --sidebar: rgba(255, 255, 255, 0.02);
            --canvas-bg: #0d0d0d;
            --border: rgba(255,255,255,0.08);
            --accent: #3b82f6;
            --text: #ffffff;
            --muted: #a0a0ab;
            --input-bg: rgba(255,255,255,0.04);
            --input-focus: rgba(255,255,255,0.08);
            
            /* Parallel Radii */
            --radius-outer: 16px;
            --radius-padding: 6px;
            --radius-inner: calc(var(--radius-outer) - var(--radius-padding));
        }
        * { margin:0; padding:0; box-sizing:border-box; transition: none !important; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* Toolbar */
        .toolbar {
            height: 64px; background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; z-index: 1000;
        }
        .toolbar-logo { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; font-size: 0.85rem; letter-spacing: 1px; color: var(--text); text-transform: uppercase; }

        /* Workspace */
        .workspace { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* Sidebar Architecture */
        .sidebar {
            background: var(--sidebar); 
            backdrop-filter: blur(20px);
            display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
            min-width: 120px;
            border-right: 1px solid var(--border);
        }
        .sidebar-right { 
            border-right: none;
            border-left: 1px solid var(--border);
            width: 300px; 
        }
        .sidebar-left { width: 220px; }

        /* Resizers */
        .resizer {
            width: 4px; background: transparent; cursor: col-resize; transition: background 0.2s !important;
            z-index: 100; position: relative;
        }
        .resizer:hover, .resizer.active { background: var(--accent); }

        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
        .sidebar-header h3 { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); font-weight: 800; }

        /* Canvas Area */
        .canvas-area {
            flex: 1; background: var(--canvas-bg); display: flex; justify-content: center; align-items: center; padding: 2rem; overflow: auto;
        }
        #canvas-container {
            width: 100%; height: 100%; background: #000;
            box-shadow: 0 60px 150px rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden;
            transition: width 0.3s ease;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* Properties Panel Folder System */
        .property-folder { border-bottom: 1px solid var(--border); }
        .folder-header { 
            padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; 
            cursor: pointer; background: rgba(255,255,255,0.02); user-select: none;
        }
        .folder-header h4 { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); font-weight: 800; }
        .folder-content { display: none; padding: 0.5rem 0; background: var(--bg); }
        .property-folder.open .folder-content { display: block; }
        .property-folder.open .folder-header { background: rgba(255,255,255,0.05); }
        .folder-icon { font-size: 10px; transition: transform 0.2s !important; color: var(--muted); }
        .property-folder.open .folder-icon { transform: rotate(90deg); }

        .property-control { padding: 1rem 1.5rem; }
        .property-control label { display: block; font-size: 0.6rem; color: var(--muted); margin-bottom: 0.5rem; font-weight: 600; }

        input[type=number], input[type=text], textarea, select {
            width: 100%; padding: 0.8rem 1rem; background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-inner);
            font-size: 0.85rem; outline: none; color: var(--text); appearance: none;
            transition: all 0.2s ease !important;
        }
        input:focus, textarea:focus, select:focus { background: var(--input-focus); border-color: var(--accent); }
        input[type=range] { width: 100%; margin-top: 1rem; accent-color: var(--accent); cursor: pointer; }

        .media-upload-zone {
            border: 1px dashed var(--border); border-radius: 12px; padding: 1.5rem; text-align: center;
            cursor: pointer; transition: all 0.2s !important;
        }
        .media-upload-zone:hover { border-color: var(--accent); background: var(--input-bg); }
        .media-upload-zone p { font-size: 0.7rem; color: var(--muted); margin-top: 0.5rem; }

        .property-group { display: flex; gap: 8px; align-items: center; }
        .property-group input { flex: 1; }
        .unit-label { font-size: 10px; color: var(--muted); font-weight: 700; width: 20px; }

        /* Buttons */
        .btn-primary { padding: 0.75rem 1.5rem; background: var(--accent); color: #fff !important; border: none; border-radius: 50px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 0.85rem; font-weight: 800; cursor: pointer; }
        .btn-sm { padding: 0.5rem 1rem; background: var(--input-bg); border-radius: 10px; border: 1px solid var(--border); font-size: 0.7rem; font-weight: 700; cursor: pointer; color: var(--text); }
        .btn-sm.active { background: var(--text); color: #000 !important; border-color: var(--text); }

        .toggle-group { display: flex; gap: 6px; background: var(--input-bg); padding: 6px; border-radius: 12px; border: 1px solid var(--border); }

        .nav-item { 
            padding: 1rem 1.5rem; font-size: 0.7rem; font-weight: 700; color: var(--muted); 
            cursor: pointer; border-bottom: 1px solid var(--border); background: transparent;
        }
        .nav-item:hover { background: var(--input-bg); color: var(--text); }

        @media (max-width: 768px) {
            .workspace {
                flex-direction: column !important;
                overflow-y: auto !important;
            }
            .sidebar-left, .sidebar-right {
                width: 100% !important;
                min-width: unset !important;
                height: auto !important;
                max-height: 260px !important;
                border-right: none !important;
                border-left: none !important;
                border-bottom: 1px solid var(--border) !important;
            }
            .resizer {
                display: none !important;
            }
            .canvas-area {
                padding: 0.5rem !important;
                height: 380px !important;
                flex: none !important;
            }
            #canvas-container {
                width: 100% !important;
                height: 100% !important;
            }
            .toolbar {
                flex-wrap: wrap !important;
                height: auto !important;
                padding: 0.8rem !important;
                gap: 0.5rem !important;
            }
            .toggle-group {
                order: 3 !important;
                width: 100% !important;
                justify-content: center !important;
            }
        }
    </style>
</head>
<body>

    <header class="toolbar">
        <div style="display:flex; align-items:center; gap:1.25rem;">
            <button class="btn-sm" onclick="location.href='/admin/dashboard.html'" style="display:flex; align-items:center; gap:8px;">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Dashboard
            </button>
            <div class="toolbar-logo">Visual Editor</div>
        </div>
        <div class="toggle-group">
            <button class="btn-sm active" onclick="setDevice('desktop', this)">Desktop</button>
            <button class="btn-sm" onclick="setDevice('tablet', this)">Tablet</button>
            <button class="btn-sm" onclick="setDevice('mobile', this)">Mobile</button>
        </div>
        <button class="btn-primary" onclick="publishChanges(event)">Publish Changes</button>
    </header>

    <div class="workspace">
        <aside class="sidebar sidebar-left" id="left-sidebar">
            <div class="sidebar-header"><h3>Sections</h3></div>
            <div id="sections-list">
                <div class="nav-item" onclick="focusSection('home')">Hero Banner</div>
                <div class="nav-item" onclick="focusSection('expertise')">Core Skills</div>
                <div class="nav-item" onclick="focusSection('projects')">Projects Grid</div>
                <div class="nav-item" onclick="focusSection('contact')">Contact Area</div>
                <div class="nav-item" onclick="focusSection('footer')">Footer</div>
            </div>
        </aside>

        <div class="resizer" id="left-resizer"></div>

        <main class="canvas-area" id="canvas-area">
            <div id="canvas-container">
                <iframe id="visual-iframe" src="/?edit=true&embedded=true"></iframe>
            </div>
        </main>

        <div class="resizer" id="right-resizer"></div>

        <aside class="sidebar sidebar-right" id="right-sidebar">
            <div class="sidebar-header"><h3>Properties</h3></div>
            <div id="properties-panel">
                <div style="padding: 2.5rem; text-align: center; color: var(--muted); font-size: 0.7rem; line-height: 1.6;">
                    Select an element to edit properties.
                </div>
            </div>
        </aside>
    </div>

    <script>
        let currentElementData = null;

        // --- Resizing Logic ---
        const leftSidebar = document.getElementById('left-sidebar');
        const rightSidebar = document.getElementById('right-sidebar');
        const leftResizer = document.getElementById('left-resizer');
        const rightResizer = document.getElementById('right-resizer');

        let isResizingLeft = false;
        let isResizingRight = false;

        leftResizer.addEventListener('mousedown', () => isResizingLeft = true);
        rightResizer.addEventListener('mousedown', () => isResizingRight = true);

        document.addEventListener('mousemove', (e) => {
            if (isResizingLeft) {
                leftSidebar.style.width = e.clientX + 'px';
            }
            if (isResizingRight) {
                rightSidebar.style.width = (window.innerWidth - e.clientX) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isResizingLeft = false;
            isResizingRight = false;
        });

        function setDevice(dev, btn) {
            document.querySelectorAll('.toggle-group .btn-sm').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const container = document.getElementById('canvas-container');
            if (dev === 'mobile') container.style.width = '375px';
            else if (dev === 'tablet') container.style.width = '768px';
            else container.style.width = '100%';
        }

        function focusSection(id) {
            sendToIframe({ source: 'cms-dashboard', action: 'scroll-to-section', id: id });
        }

        window.addEventListener('message', (e) => {
            if (e.data.action === 'canvas-ready') {
                document.getElementById('properties-panel').innerHTML = '<div style="padding: 2.5rem; text-align: center; color: #10b981; font-size: 0.7rem;">Canvas Connected. Select an element.</div>';
            }
            if (e.data.action === 'element-selected') {
                currentElementData = e.data.data;
                try {
                    renderProperties(e.data.data);
                    // Animate properties panel reveal
                    Motion.animate("#properties-panel", { opacity: [0, 1], x: [20, 0] }, { duration: 0.4 });
                } catch (err) {
                    console.error(err);
                    document.getElementById('properties-panel').innerHTML = `<div style="padding: 2rem; color: #ef4444; font-size: 0.7rem;">Error rendering properties: ${err.message}</div>`;
                }
            }
        });

        window.onerror = function(msg, url, line) {
            console.error("Editor Error: " + msg + " at " + line);
        };

        function renderProperties(data) {
            const panel = document.getElementById('properties-panel');
            if (!data) {
                panel.innerHTML = '<div style="padding: 2.5rem; text-align: center; color: var(--muted); font-size: 0.7rem;">Select an element to edit properties.</div>';
                return;
            }

            let html = '';

            // --- Context Header ---
            html += `<div style="padding: 1.5rem 1.5rem 0; color: var(--accent); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 800;">Editing ${data.isBanner ? 'Layered Banner' : (data.tagName || 'Element')}</div>`;

            // --- 1. Content Section ---
            if (data.content !== undefined && !data.isBanner) {
                html += createFolder('Content', `
                    <div class="property-control">
                        <label>Text / HTML</label>
                        <textarea rows="4" oninput="updateContent('${data.id}', this.value)">${data.content}</textarea>
                    </div>
                `, true);
            }

            // --- 2. Layered Banner Configuration (Folder 1 / Folder 2 style) ---
            if (data.isBanner) {
                // Folder 1: Top Layer (Glass UI)
                html += createFolder('Layer 1: Interface (Glass Overlay)', `
                    <div class="property-control">
                        <label>Glass Effect Opacity</label>
                        <div class="property-group">
                            <input type="range" min="0" max="100" value="${(data.glassOpacity || 1) * 100}" oninput="updateBannerGlass('${data.id}', this.value)">
                        </div>
                        <p style="font-size: 10px; color: var(--muted); margin-top: 5px;">Adjust the intensity of the ribbed glass texture.</p>
                    </div>
                `, true);

                // Folder 2: Bottom Layer (Media Content)
                html += createFolder('Layer 2: Media (Video/GIF/Image)', `
                    <div class="property-control">
                        <label>Media Source</label>
                        <div class="media-upload-zone" onclick="triggerMediaUpload('${data.id}')">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin:0 auto; opacity:0.5;"><path d="M12 4v16m8-8H4"/></svg>
                            <p>${data.src ? 'Replace current media' : 'Click to upload media'}</p>
                        </div>
                        <p style="font-size: 10px; color: var(--muted); margin-top: 10px;">Supports .mp4, .gif, .jpg, and .png</p>
                    </div>
                    ${data.src ? `
                    <div class="property-control">
                        <label>Current Media</label>
                        <div style="font-size: 10px; color: var(--accent2); word-break: break-all; opacity: 0.6;">${data.src.substring(0, 50)}...</div>
                    </div>` : ''}
                `, true);
            }

            // --- 3. Typography Section ---
            if (data.style) {
                const currentFont = data.style.fontFamily.split(',')[0].replace(/['"]/g, '');
                html += createFolder('Typography', `
                    <div class="property-control">
                        <label>Font Type</label>
                        <select onchange="updateStyle('${data.id}', 'fontFamily', this.value)">
                            <option value="'Inter', sans-serif" ${currentFont === 'Inter' ? 'selected' : ''}>Inter (Body)</option>
                            <option value="'Outfit', sans-serif" ${currentFont === 'Outfit' ? 'selected' : ''}>Outfit (Heading)</option>
                        </select>
                    </div>
                    <div class="property-control">
                        <label>Font Size</label>
                        <div class="property-group">
                            <input type="number" value="${parseInt(data.style.fontSize) || 16}" oninput="updateStyle('${data.id}', 'fontSize', this.value + 'px')">
                            <span class="unit-label">PX</span>
                        </div>
                    </div>
                `);
            }

            // --- 4. Layout & Spacing Section ---
            if (data.style) {
                html += createFolder('Layout & Spacing', `
                    <div class="property-control">
                        <label>Inner Padding (Bottom)</label>
                        <input type="range" min="0" max="200" value="${parseInt(data.style.paddingBottom) || 0}" oninput="updateStyle('${data.id}', 'paddingBottom', this.value + 'px')">
                    </div>
                    <div class="property-control">
                        <label>Corner Radius</label>
                        <input type="range" min="0" max="100" value="${parseInt(data.style.borderRadius) || 0}" oninput="updateStyle('${data.id}', 'borderRadius', this.value + 'px')">
                    </div>
                `);
            }

            panel.innerHTML = html;
        }

        function createFolder(name, content, isOpen = false) {
            return `
            <div class="property-folder ${isOpen ? 'open' : ''}">
                <div class="folder-header" onclick="this.parentElement.classList.toggle('open')">
                    <h4>${name}</h4>
                    <span class="folder-icon">▶</span>
                </div>
                <div class="folder-content">${content}</div>
            </div>`;
        }

        function updateContent(id, val) {
            sendToIframe({ source: 'cms-dashboard', action: 'update-content', data: { id, val } });
        }

        function updateStyle(id, prop, val) {
            sendToIframe({ source: 'cms-dashboard', action: 'update-style', data: { id, property: prop, value: val } });
        }

        function triggerMediaUpload(id) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,video/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const mediaType = file.type.startsWith('video') ? 'video' : 'image';
                        sendToIframe({ source: 'cms-dashboard', action: 'update-media', data: { id, mediaType, src: event.target.result } });
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function updateBannerGlass(id, val) {
            const iframe = document.getElementById('visual-iframe');
            iframe.contentWindow.postMessage({ source: 'cms-dashboard', action: 'update-glass', id, value: val / 100 }, '*');
        }

        function sendToIframe(msg) {
            const iframe = document.getElementById('visual-iframe');
            iframe.contentWindow.postMessage(msg, '*');
        }

        async function publishChanges(event) {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = 'Publishing...';
            btn.disabled = true;

            sendToIframe({ source: 'cms-dashboard', action: 'get-html' });

            const responseHandler = async (e) => {
                if (e.data.action === 'html-response') {
                    window.removeEventListener('message', responseHandler);
                    try {
                        const res = await fetch('/admin/save-cms', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ html: e.data.html })
                        });
                        if (res.ok) {
                            alert('✅ Success! Website updated.');
                        } else {
                            const errData = await res.json();
                            alert('❌ Error: ' + (errData.error || 'Save failed.'));
                        }
                    } catch (err) {
                        alert('❌ Network Error: ' + err.message);
                    } finally {
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                }
            };
            window.addEventListener('message', responseHandler);
        }
    </script>
</body>
</html>
