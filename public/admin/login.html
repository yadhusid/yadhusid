<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Yadhu Portfolio CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #000000;
            --sidebar: #050505;
            --border: rgba(255,255,255,0.12);
            --text: #ffffff;
            --muted: #71717a;
            --input-bg: rgba(255,255,255,0.06);
            --input-focus: rgba(255,255,255,0.1);
            --accent: #3b82f6;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .logo {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .sub {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 2.5rem;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        label {
            display: block;
            font-size: 0.65rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 14px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s, background 0.2s;
            outline: none;
        }

        input:focus {
            background: var(--input-focus);
            border-color: rgba(255,255,255,0.12);
        }

        input::placeholder { color: var(--muted); }

        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--text);
            border: none;
            border-radius: 50px;
            color: #000;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.9);
        }

        .error {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-msg {
            background: rgba(34,197,94,0.08);
            border: 1px solid rgba(34,197,94,0.25);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #4ade80;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .forgot-link {
            display: block;
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
        }

        .forgot-link:hover { color: var(--text); }
        #otpWrap { display: none; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="logo">YADSID</div>
        <p class="sub">CMS Admin Panel</p>
        <div class="card">
            <div class="error" id="errorMsg">Invalid username or password.</div>
            <div class="success-msg" id="successMsg">OTP sent to your registered email.</div>

            <form id="loginForm">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="yadhusid" required autocomplete="off">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="submit" class="btn">Sign In →</button>
                <a class="forgot-link" onclick="showOTP()">Forgot Password?</a>
            </form>

            <form id="otpWrap">
                <p style="font-size:0.85rem; color:var(--muted); margin-bottom:1.5rem; line-height:1.6;">An OTP has been logged to the server console. Enter it below to reset your password.</p>
                <label>6-Digit OTP</label>
                <input type="text" id="otpCode" placeholder="000000" maxlength="6">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="New Password">
                <button type="button" class="btn" onclick="resetPassword()">Reset Password</button>
                <a class="forgot-link" onclick="hideOTP()">← Back to Login</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (res.ok) {
                window.location.href = '/admin/dashboard.html';
            } else {
                showStatus('Invalid credentials', true);
            }
        });

        function showOTP() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('otpWrap').style.display = 'block';
            fetch('/api/auth/forgot-password', { method: 'POST' });
            showStatus('OTP logged to server console.');
        }

        function hideOTP() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('otpWrap').style.display = 'none';
        }

        async function resetPassword() {
            const otp = document.getElementById('otpCode').value;
            const newPassword = document.getElementById('newPassword').value;
            if (otp.length !== 6) return showStatus('Enter 6-digit OTP', true);

            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ otp, newPassword })
            });

            if (res.ok) {
                showStatus('Password reset successfully!');
                setTimeout(hideOTP, 2000);
            } else {
                showStatus('Invalid OTP or error', true);
            }
        }

        function showStatus(msg, isError = false) {
            const err = document.getElementById('errorMsg');
            const succ = document.getElementById('successMsg');
            err.style.display = 'none';
            succ.style.display = 'none';
            if (isError) {
                err.textContent = msg;
                err.style.display = 'block';
            } else {
                succ.textContent = msg;
                succ.style.display = 'block';
            }
        }
    </script>
</body>
</html>
