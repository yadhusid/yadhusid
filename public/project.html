<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Yadhu Sidharthan</title>
    <meta name="description" content="Portfolio project by Yadhu Sidharthan">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --muted: #555555;
            --accent: #000000;
            --accent2: #333333;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }

        /* Nav */
        nav {
            position: fixed; top:0; width:100%; padding:1.2rem 2rem;
            background:rgba(255,255,255,0.7); backdrop-filter:blur(20px) saturate(180%);
            border-bottom:1px solid rgba(0,0,0,0.05);
            display:flex; align-items:center; justify-content:space-between; z-index:100;
        }
        .nav-logo { font-family:'Outfit',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:2px; text-decoration:none; color:var(--text); }
        .nav-back { display:flex; align-items:center; gap:0.5rem; color:var(--muted); text-decoration:none; font-size:0.9rem; transition:color 0.2s; font-weight: 600; }
        .nav-back:hover { color:var(--text); }

        /* Hero */
        .hero {
            width:100%; height:75vh; min-height:450px;
            position:relative; overflow:hidden;
            display:flex; align-items:flex-end;
            background: #f8f8f8;
        }
        .hero-img {
            position:absolute; inset:0; width:100%; height:100%;
            object-fit:cover; filter: grayscale(0.2) contrast(1.1);
        }
        .hero-placeholder {
            position:absolute; inset:0;
            background: #eeeeee;
        }
        .hero-gradient {
            position:absolute; inset:0;
            background: linear-gradient(to top, rgba(255,255,255,1) 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
        }
        .hero-content {
            position:relative; z-index:2; padding:4rem 2rem 3rem;
            max-width:900px; margin:0 auto; width:100%;
        }
        .project-category {
            display:inline-block; padding:0.4rem 1rem; border-radius:20px;
            background:rgba(0,0,0,0.05); border:1px solid rgba(0,0,0,0.1);
            color:var(--text); font-size:0.8rem; font-weight:600;
            text-transform:uppercase; letter-spacing:2px; margin-bottom:1.25rem;
        }
        .project-title {
            font-family:'Outfit',sans-serif; font-size:clamp(2rem,5vw,3.5rem);
            font-weight:800; line-height:1.1; margin-bottom:1rem;
            color: var(--text);
        }
        .project-desc {
            color: var(--muted); font-size:1.1rem; max-width:600px; line-height:1.7;
        }

        /* Case Study Body */
        .case-study {
            max-width: 860px;
            margin: 0 auto;
            padding: 4rem 2rem 6rem;
        }

        .block-text {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text);
            margin-bottom: 3rem;
        }

        .block-image {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 3rem;
            display: block;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            transition: transform 0.4s ease;
        }
        .block-image:hover { transform: scale(1.01); }

        /* Loading & Error */
        .loading {
            display: flex; align-items: center; justify-content: center;
            height: 60vh; flex-direction: column; gap: 1rem; color: var(--muted);
        }
        .spinner {
            width:40px; height:40px; border:3px solid rgba(0,0,0,0.05);
            border-top-color: var(--text); border-radius:50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer */
        footer {
            text-align:center; padding:2rem; color:var(--muted);
            font-size:0.9rem; border-top:1px solid rgba(0,0,0,0.05);
        }

        /* Fade-in animation */
        .fade-in { opacity:0; transform:translateY(24px); transition:opacity 0.7s ease, transform 0.7s ease; }
        .fade-in.visible { opacity:1; transform:translateY(0); }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-logo">YADHU.AI</a>
        <a href="/#projects" class="nav-back">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Portfolio
        </a>
    </nav>

    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <span>Loading project...</span>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Yadhu Sidharthan. All rights reserved.</p>
    </footer>

    <script>
        async function loadProject() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) {
                document.getElementById('app').innerHTML = '<div class="loading"><p style="color:#f87171">No project ID specified.</p><a href="/" style="color:#6366f1">← Go Home</a></div>';
                return;
            }

            const res = await fetch('/api/projects/' + id);
            if (!res.ok) {
                document.getElementById('app').innerHTML = '<div class="loading"><p style="color:#f87171">Project not found.</p><a href="/" style="color:#6366f1">← Go Home</a></div>';
                return;
            }

            const project = await res.json();
            document.title = project.title + ' | Yadhu Sidharthan';

            const heroHTML = `
                <section class="hero">
                    ${project.coverImage
                        ? `<img src="${project.coverImage}" class="hero-img" alt="${project.title}">`
                        : '<div class="hero-placeholder"></div>'}
                    <div class="hero-gradient"></div>
                    <div class="hero-content">
                        <span class="project-category">${project.categoryName || 'Project'}</span>
                        <h1 class="project-title">${project.title}</h1>
                        ${project.description ? `<p class="project-desc">${project.description}</p>` : ''}
                    </div>
                </section>`;

            const blocks = [...(project.blocks || [])].sort((a,b) => a.order - b.order);
            const blocksHTML = blocks.map(block => {
                if (block.type === 'image') {
                    return `<img src="${block.content}" class="block-image fade-in" alt="Project image" loading="lazy">`;
                } else {
                    return `<div class="block-text fade-in">${block.content.replace(/\n/g,'<br>')}</div>`;
                }
            }).join('');

            document.getElementById('app').innerHTML = `
                ${heroHTML}
                <div class="case-study">
                    ${blocks.length ? blocksHTML : '<p style="color:#a0a0ab;text-align:center;padding:3rem 0;">No content blocks yet. Add some from the admin panel.</p>'}
                </div>`;

            // Scroll animations
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        }

        loadProject();
    </script>
</body>
</html>
