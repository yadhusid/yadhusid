<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Yadhu Sidharthan</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@300;400;600;800&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                screens: {
                    'md': '861px',    /* Tablet and up */
                    'lg': '1218px',   /* Desktop and up */
                },
                extend: {
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        figma: {
                            orange: '#FF4B2B',
                            pink: '#FF416C',
                            yellow: '#FFB347',
                            tag: '#F0F0F0',
                        }
                    },
                    borderRadius: {
                        'figma': '24px',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        :root {
            --global-padding-desktop: 11vw;
            --global-padding-tablet: clamp(8vw, 9vw, 10vw);
            --global-padding-mobile: 5.2vw;
            --hero-outer-padding: 0.9vw;
            --nav-offset: 2.1vw;
            --grid-gap: 1.8vw;
            --scroll-offset: 80px;

            /* Parallel Radii Logic */
            --radius-outer: 32px;
            --radius-padding: 12px;
            --radius-inner: calc(var(--radius-outer) - var(--radius-padding));
            --banner-radius: var(--radius-outer);
            --nav-radius: var(--radius-inner);
            --nav-inset: 2.1vw;
        }
        body { background-color: #ffffff; color: #111111; overflow-x: hidden; }
        
        /* Font Override */
        html, body, h1, h2, h3, h4, h5, h6, p, span, a, button, input, textarea, div {
            font-family: 'Outfit', sans-serif !important;
        }
        @layer utilities {
            .font-heading { font-family: 'Outfit', sans-serif; }
            h1, h2, h3, h4 { @apply font-heading tracking-tight; }
        }
        
        .global-padding {
            padding-left: var(--global-padding-desktop);
            padding-right: var(--global-padding-desktop);
        }
        @media (max-width: 1279px) and (min-width: 768px) {
            .global-padding {
                padding-left: var(--global-padding-tablet);
                padding-right: var(--global-padding-tablet);
            }
        }
        @media (max-width: 767px) {
            .global-padding {
                padding-left: var(--global-padding-mobile);
                padding-right: var(--global-padding-mobile);
            }
        }

        header {
            transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        left 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        right 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        width 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        max-width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: top, left, right, padding, transform, width, max-width;
        }
        .glass-nav {
            @apply bg-white/80 backdrop-blur-xl border border-white/20 shadow-sm flex flex-col justify-start overflow-hidden;
            height: 50px;
            border-radius: 50px !important;
            transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        border-radius 0.4s ease;
            z-index: 100;
        }

        .glass-nav.active {
            height: 340px;
            border-radius: 24px !important;
        }

        .nav-main-row {
            @apply flex items-center justify-between w-full;
            height: 50px;
            min-height: 50px;
            flex-shrink: 0;
            color: #111111;
            padding-left: calc(var(--global-padding-desktop) - var(--hero-outer-padding) - var(--nav-inset)) !important;
            padding-right: calc(var(--global-padding-desktop) - var(--hero-outer-padding) - var(--nav-inset)) !important;
            transition: padding 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #mobile-menu-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 0;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(-20px);
            pointer-events: none;
        }

        .glass-nav.active #mobile-menu-content {
            display: flex;
            opacity: 100;
            pointer-events: auto;
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            #mobile-menu-content {
                display: none !important;
            }
        }

        /* Scrolled state: dock to top edge */
        header.scrolled,
        header.navbar-fixed-top {
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            padding: 0 !important;
            transform: translateX(0) !important;
            width: 100% !important;
            max-width: none !important;
        }
        header.scrolled .glass-nav,
        header.navbar-fixed-top .glass-nav {
            border-radius: 0 !important;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
            max-width: 100%;
        }
        header.scrolled .beading-frame,
        header.navbar-fixed-top .beading-frame {
            display: none;
        }
        header.scrolled .nav-main-row,
        header.navbar-fixed-top .nav-main-row {
            padding-left: var(--global-padding-desktop) !important;
            padding-right: var(--global-padding-desktop) !important;
        }
        @media (max-width: 1279px) and (min-width: 768px) {
            header.scrolled .nav-main-row,
            header.navbar-fixed-top .nav-main-row {
                padding-left: var(--global-padding-tablet) !important;
                padding-right: var(--global-padding-tablet) !important;
            }
        }
        @media (max-width: 767px) {
            header.scrolled .nav-main-row,
            header.navbar-fixed-top .nav-main-row {
                padding-left: var(--global-padding-mobile) !important;
                padding-right: var(--global-padding-mobile) !important;
            }
        }

        .nav-link:hover {
            color: #FF416C;
        }

        /* Beading Frame Logic */
        .beading-frame {
            position: absolute;
            inset: calc(-1 * var(--nav-inset));
            border-top: var(--nav-inset) solid rgba(255, 255, 255, 0.05);
            border-left: var(--nav-inset) solid rgba(255, 255, 255, 0.05);
            border-right: var(--nav-inset) solid rgba(255, 255, 255, 0.05);
            border-radius: var(--banner-radius);
            pointer-events: none;
            z-index: -1;
        }
        
        .project-content-block {
            display: flex;
            flex-direction: column;
        }
        .project-content-block img, .project-content-block video {
            width: 100%;
            display: block;
        }
        @keyframes fadeUpReveal {
            from {
                opacity: 0;
                transform: translateY(20px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }
        
        @keyframes loadingPulse {
            0% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.95); }
        }
        .loading-text-anim {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #888;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 80px 0;
            grid-column: 1 / -1;
            width: 100%;
        }
        .loading-text-anim span {
            animation: loadingPulse 1.5s infinite ease-in-out;
        }
        .loading-text-anim .dot {
            width: 6px;
            height: 6px;
            background-color: #888;
            border-radius: 50%;
            display: inline-block;
        }
        .loading-text-anim .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-text-anim .dot:nth-child(3) { animation-delay: 0.4s; }
        .loading-text-anim .dot:nth-child(4) { animation-delay: 0.6s; }
    </style>
</head>
<body class="bg-white">

    <header class="fixed z-50 w-full scrolled navbar-fixed-top" style="top: 0; left: 0; right: 0; padding: 0;">
        <nav class="glass-nav relative" id="main-nav">
            <!-- Beading Frame: Bridges gap to banner edges -->
            <div class="beading-frame" style="display: none;"></div>
            <div class="nav-main-row flex items-center justify-between flex-nowrap w-full">
                <div class="flex items-center gap-2 flex-nowrap min-w-fit">
                    <a href="/#home" class="flex items-center gap-2 flex-nowrap min-w-fit cursor-pointer group nav-scroll">
                        <img src="/Yadsid_LOGO_B.svg" alt="Yadsid Logo" class="w-[26.4px] h-[26.4px] flex-shrink-0 transition-transform duration-300 group-hover:scale-[1.15]">
                        <div class="text-[15px] font-extrabold tracking-tight whitespace-nowrap leading-none flex items-center transition-colors" style="margin: 0; padding: 0;">yadsid.com</div>
                    </a>
                </div>
                
                <div class="flex items-center">
                    <!-- Desktop Menu -->
                    <div class="hidden md:flex items-center gap-1 text-[14.5px] font-medium text-[#111]">
                        <a href="/#home" class="nav-scroll inline-flex items-center justify-center h-[38px] px-5 rounded-full transition-all duration-300 hover:bg-black/5 hover:text-black">Home</a>
                        <a href="/#expertise" class="nav-scroll inline-flex items-center justify-center h-[38px] px-5 rounded-full transition-all duration-300 hover:bg-black/5 hover:text-black">Core Skills</a>
                        <a href="/#projects" class="nav-scroll inline-flex items-center justify-center h-[38px] px-5 rounded-full transition-all duration-300 hover:bg-black/5 hover:text-black">Projects</a>
                        <a href="/#contact" class="nav-scroll inline-flex items-center justify-center h-[38px] px-5 rounded-full transition-all duration-300 bg-[#111] text-white hover:bg-[#FF416C] hover:-translate-y-[2px] active:scale-95 shadow-sm hover:shadow-lg">Let's Talk</a>
                    </div>
                    
                    <!-- Mobile Hamburger -->
                    <button id="hamburger" class="md:hidden flex flex-col justify-center items-center w-8 h-8 gap-1.5 z-50 ml-2">
                        <span class="block w-6 h-0.5 bg-black transition-all duration-300"></span>
                        <span class="block w-6 h-0.5 bg-black transition-all duration-300"></span>
                        <span class="block w-6 h-0.5 bg-black transition-all duration-300"></span>
                    </button>
                </div>
            </div>
            
            <!-- Mobile Menu Content -->
            <div id="mobile-menu-content" class="hidden flex-col items-center justify-center gap-6 py-10 opacity-0 pointer-events-none transition-all duration-500">
                <a href="/#home" class="nav-scroll text-lg font-medium hover:text-[#FF416C] transition-colors" onclick="toggleMenu()">Home</a>
                <a href="/#expertise" class="nav-scroll text-lg font-medium hover:text-[#FF416C] transition-colors" onclick="toggleMenu()">Core Skills</a>
                <a href="/#projects" class="nav-scroll text-lg font-medium hover:text-[#FF416C] transition-colors" onclick="toggleMenu()">Projects</a>
                <a href="/#contact" class="nav-scroll text-lg font-medium hover:text-[#FF416C] transition-colors" onclick="toggleMenu()">Let's Talk</a>
            </div>
        </nav>
    </header>

    <section class="w-full global-padding" style="padding-top: calc(50px + clamp(32px, 4vw, 48px)); padding-bottom: clamp(32px, 4vw, 48px);">
        <h1 id="proj-title" class="text-[clamp(16px,2vw,24px)] font-bold tracking-tight leading-[1.0] text-center"></h1>
    </section>

    <!-- Content Blocks Container -->
    <section id="project-blocks" class="w-full global-padding flex flex-col gap-0" style="padding-bottom: 100px; padding-top: 0;">
        <div class="loading-text-anim">
            <span>Loading Project</span>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </section>

    <footer class="py-[1.7vw] w-full border-t border-[#F2F2F2]">
        <div class="flex flex-col md:flex-row items-center justify-between text-[11px] font-medium text-[#888] global-padding">
            <div class="font-bold text-[#111] mb-4 md:mb-0 flex items-center gap-2">
                <a href="/#home" class="flex items-center gap-2 nav-scroll group">
                    <img src="/Yadsid_LOGO_B.svg" alt="Yadsid Logo" class="w-[22px] h-[22px] flex-shrink-0 transition-transform duration-300 group-hover:scale-105">
                    <span class="text-[14.5px] transition-colors group-hover:text-[#FF416C]">yadsid.com</span>
                </a>
            </div>
            <div class="mb-4 md:mb-0">© 2026 Yadhu Sidharthan. All rights reserved.</div>
        </div>
    </footer>

    <script>
        // Mobile Menu Toggle
        const hamburger = document.getElementById('hamburger');
        const mainNav = document.getElementById('main-nav');
        
        function toggleMenu() {
            mainNav.classList.toggle('active');
            const spans = hamburger.querySelectorAll('span');
            if (mainNav.classList.contains('active')) {
                spans[0].style.transform = 'translateY(7.5px) rotate(45deg)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'translateY(-7.5px) rotate(-45deg)';
            } else {
                spans[0].style.transform = '';
                spans[1].style.opacity = '1';
                spans[2].style.transform = '';
            }
        }
        if (hamburger) hamburger.addEventListener('click', toggleMenu);



        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            if (!projectId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const res = await fetch('/api/projects/' + projectId);
                if (!res.ok) throw new Error('Project not found');
                const project = await res.json();

                document.title = `${project.title} | Yadhu Sidharthan`;
                document.getElementById('proj-title').textContent = project.title;

                const blocksContainer = document.getElementById('project-blocks');
                
                // Gap exception removed for seamless integration
                if (project.blocks && project.blocks.length) {
                    const sorted = project.blocks.sort((a,b) => a.order - b.order);
                    blocksContainer.innerHTML = sorted.map((b, i) => {
                        let content = '';
                        const radiusClass = `${b.radiusTop ? 'rounded-t-[32px]' : ''} ${b.radiusBottom ? 'rounded-b-[32px]' : ''}`;
                        const gapClass = b.hasGap ? 'mb-8' : '';
                        const delay = (i % 20) * 100;
                        const animStyle = `opacity: 0; animation: fadeUpReveal 0.6s ease-out ${delay}ms forwards;`;

                        if (b.type === 'text') {
                            content = `<div class="max-w-3xl text-[clamp(14px,1vw,16px)] text-[#444] leading-[1.8] py-8" style="${animStyle}">${b.content.replace(/\n/g, '<br>')}</div>`;
                        } else if (b.type === 'image') {
                            content = `<div class="project-content-block overflow-hidden ${radiusClass} ${gapClass}" style="${animStyle}">
                                          <img src="${b.content}" alt="Project detail" loading="lazy">
                                       </div>`;
                        } else if (b.type === 'video') {
                            content = `<div class="project-content-block overflow-hidden ${radiusClass} ${gapClass}">
                                          <video src="${b.content}" muted loop autoplay playsinline></video>
                                       </div>`;
                        } else if (b.type === 'spacing') {
                            content = `<div class="h-12"></div>`;
                        } else if (b.type === 'divider') {
                            content = `<hr class="border-[#E5E5E5] my-8">`;
                        }
                        return content;
                    }).join('');
                } else {
                    blocksContainer.innerHTML = '<div class="py-20 text-center text-gray-400">No content available for this project.</div>';
                }

            } catch (err) {
                console.error(err);
                document.body.innerHTML = `<div class="min-h-screen flex items-center justify-center flex-col gap-4">
                    <h1 class="text-4xl font-bold">Project Not Found</h1>
                    <a href="index.html" class="text-blue-500 hover:underline">Back to Home</a>
                </div>`;
            }
        });
    </script>
</body>
</html>
