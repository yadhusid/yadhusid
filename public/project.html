<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Yadhu Sidharthan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        :root {
            /* Synchronized with Homepage Spacing */
            --global-padding-desktop: 11vw;
            --global-padding-tablet: clamp(8vw, 9vw, 10vw);
            --global-padding-mobile: 5.2vw;
            --nav-height: 80px;
        }
        
        @layer base {
            font-family { font-family: 'Inter', sans-serif; }
            h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
        }

        body { font-family: 'Inter', sans-serif; background: #000000; color: #ffffff; padding-top: var(--nav-height); }
        
        .global-padding {
            padding-left: var(--global-padding-desktop);
            padding-right: var(--global-padding-desktop);
        }
        
        @media (max-width: 1279px) and (min-width: 768px) {
            .global-padding {
                padding-left: var(--global-padding-tablet);
                padding-right: var(--global-padding-tablet);
            }
        }
        @media (max-width: 767px) {
            .global-padding {
                padding-left: var(--global-padding-mobile);
                padding-right: var(--global-padding-mobile);
            }
        }

        /* Permanently Docked Squared Navbar */
        .glass-nav {
            @apply fixed top-0 left-0 right-0 z-50 bg-black/40 backdrop-blur-2xl border-b border-white/10 flex items-center justify-between;
            height: var(--nav-height);
        }

        .btn-back {
            @apply flex items-center gap-2 text-[12px] font-bold uppercase tracking-[0.1em] text-white/60 hover:text-white transition-all duration-300;
        }
    </style>
</head>
<body>

    <header class="glass-nav global-padding">
        <a href="/#projects" class="btn-back group">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="group-hover:-translate-x-1 transition-transform"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Projects
        </a>
        <a href="/" class="text-[15px] font-extrabold tracking-tight flex items-center gap-2 text-white">
            <div class="w-6 h-6 bg-white rounded-full"></div>
            yadsid.com
        </a>
    </header>

    <div id="app"></div>

    <!-- Reusable Footer Area -->
    <div id="thank-you-section" class="hidden">
        <section class="global-padding py-[12vw]">
            <div class="bg-[#0d0d0d] border border-white/10 rounded-[48px] p-[8%] text-white thank-you-card flex flex-col md:flex-row items-center justify-between gap-12">
                <div class="ty-text">
                    <h2 class="text-[clamp(36px,5.5vw,72px)] font-bold mb-[2vw] leading-none font-heading tracking-tighter">Do you like what you see?</h2>
                    <p class="text-white/60 text-[16px] mb-[3.5vw] max-w-2xl leading-relaxed">
                        I'm currently available for new projects and collaborations. Let's create something extraordinary together.
                    </p>
                    <div class="flex flex-wrap gap-4 ty-buttons">
                        <a href="/#contact" class="bg-white text-black px-10 py-4 rounded-full text-[14px] font-bold hover:scale-105 transition-transform">Let's Talk</a>
                        <a href="/" class="bg-white/10 backdrop-blur-md border border-white/20 text-white px-10 py-4 rounded-full text-[14px] font-bold hover:bg-white/20 transition-all">More Projects</a>
                    </div>
                </div>
                <div class="ty-icons flex gap-5 md:flex-col">
                    <a href="#" class="w-14 h-14 bg-white/5 border border-white/10 rounded-full flex items-center justify-center font-bold text-[18px] hover:bg-white hover:text-black transition-all">in</a>
                    <a href="#" class="w-14 h-14 bg-white/5 border border-white/10 rounded-full flex items-center justify-center font-bold text-[18px] hover:bg-white hover:text-black transition-all">Bē</a>
                </div>
            </div>
        </section>
    </div>

    <footer class="py-[5vw] text-center border-t border-white/10">
        <p class="text-[11px] text-white/40 tracking-widest uppercase">© 2026 Yadhu Sidharthan. All rights reserved.</p>
    </footer>

    <script>
        async function loadProject() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) return;

            const res = await fetch('/api/projects/' + id);
            if (!res.ok) {
                document.getElementById('app').innerHTML = `<div class="global-padding py-20 text-center">Project not found.</div>`;
                return;
            }

            const project = await res.json();
            document.title = project.title + ' | Yadhu Sidharthan';

            const blocks = [...(project.blocks || [])].sort((a,b) => a.order - b.order);
            
            const contentHTML = `
                <div class="global-padding py-[10vw]">
                    <span class="inline-block px-4 py-1.5 bg-white/10 rounded-full text-[10px] font-bold uppercase tracking-widest mb-8 text-white/60">${project.categoryName || 'Design'}</span>
                    <h1 class="text-[clamp(44px,7.5vw,110px)] font-bold leading-[0.85] tracking-tighter mb-10 font-heading max-w-5xl text-white">${project.title}</h1>
                    <p class="text-white/80 text-[clamp(18px,1.6vw,22px)] max-w-3xl leading-relaxed mb-12 font-light">${project.description || ''}</p>
                </div>
                
                <div class="flex flex-col gap-0 global-padding">
                    ${blocks.map(b => {
                        const radiusClass = `${b.radiusTop ? 'rounded-t-[48px]' : ''} ${b.radiusBottom ? 'rounded-b-[48px]' : ''}`;
                        const gapStyle = b.hasGap ? 'margin-top: 4vw; margin-bottom: 4vw;' : 'margin: 0;';
                        
                        if (b.type === 'image') return `<img src="${b.content}" class="w-full ${radiusClass} object-cover" style="${gapStyle}">`;
                        if (b.type === 'video') return `<video src="${b.content}" class="w-full ${radiusClass}" style="${gapStyle}" autoplay loop muted playsinline></video>`;
                        if (b.type === 'spacing') return `<div style="height: 4vw; min-height: 40px;"></div>`;
                        if (b.type === 'divider') return `<div class="global-padding"><hr class="border-[#E5E5E5] w-full"></div>`;
                        return `<div class="global-padding text-[clamp(16px,1.2vw,20px)] leading-[1.8] text-[#333]" style="${gapStyle}">${b.content.replace(/\n/g,'<br>')}</div>`;
                    }).join('')}
                    
                    ${(project.images || []).map(img => {
                        return `<img src="${img}" class="w-full object-cover" style="margin: 0;">`;
                    }).join('')}
                </div>
                ${document.getElementById('thank-you-section').innerHTML}
            `;

            document.getElementById('app').innerHTML = contentHTML;
        }
        loadProject();
    </script>
</body>
</html>
