<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | Yadhu Sidharthan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        :root {
            --global-padding-desktop: 12.1vw;
            --global-padding-tablet: 0px;
            --global-padding-mobile: 0px;
            --nav-height: 64px;

            /* Parallel Radii */
            --radius-outer: 32px;
            --radius-padding: 12px;
            --radius-inner: calc(var(--radius-outer) - var(--radius-padding));
        }
        
        @layer base {
            font-family { font-family: 'Inter', sans-serif; }
            h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
        }

        body { font-family: 'Inter', sans-serif; background: #fff; color: #111; padding-top: var(--nav-height); }
        
        .global-padding {
            padding-left: var(--global-padding-desktop);
            padding-right: var(--global-padding-desktop);
        }
        
        @media (max-width: 1024px) {
            :root {
                --global-padding-desktop: 0px;
                --global-padding-tablet: 0px;
                --global-padding-mobile: 0px;
            }
            .glass-nav {
                padding-left: 6vw !important;
                padding-right: 6vw !important;
            }
            .ty-card-section {
                padding-left: 6vw !important;
                padding-right: 6vw !important;
            }
        }

        /* Permanently Docked Squared Navbar */
        .glass-nav {
            @apply fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-2xl border-b border-black/5 flex items-center justify-between;
            height: var(--nav-height);
        }

        .btn-back {
            @apply flex items-center gap-2 text-[12px] font-bold uppercase tracking-[0.1em] text-[#666] hover:text-black transition-all duration-300;
        }

        /* Removed Animations as requested */
        .reveal { 
            opacity: 1 !important; 
            transform: none !important; 
        }
        /* Ensure media is visible even if JS fails */
        @media (prefers-reduced-motion: reduce) {
            .reveal { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>

    <header class="glass-nav global-padding">
        <a href="/" class="text-[15px] font-extrabold tracking-tight flex items-center gap-2 hover:opacity-70 transition-opacity">
            <div class="w-6 h-6 bg-[#111] rounded-full"></div>
            yadsid.com
        </a>
        <a href="/#projects" class="bg-[#111] text-white px-7 py-2 rounded-full text-[12px] font-bold uppercase tracking-widest hover:scale-105 active:scale-95 transition-all duration-300 flex items-center gap-2 shadow-lg shadow-black/10">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Projects
        </a>
    </header>

    <div id="app"></div>

    <!-- Reusable Footer Area -->
    <div id="thank-you-section" class="hidden">
        <section class="global-padding py-[6vw] ty-card-section">
            <div class="bg-[#111] rounded-[40px] p-[6%] text-white thank-you-card flex flex-col md:flex-row items-center justify-between gap-10 overflow-hidden relative" 
                 style="background-image: var(--card-banner, none); background-size: cover; background-position: center;">
                <!-- Banner Overlay if needed -->
                <div class="absolute inset-0 bg-black/40 z-0" style="display: var(--card-overlay, none);"></div>
                
                <div class="ty-text relative z-10">
                    <h2 class="text-[clamp(28px,4.2vw,54px)] font-bold mb-[1.5vw] leading-[1.1] font-heading tracking-tight">Do you like what you see?</h2>
                    <p class="text-white/70 text-[15px] mb-[2.5vw] max-w-xl leading-relaxed font-light">
                        I'm currently available for new projects and collaborations. Let's create something extraordinary together.
                    </p>
                    <div class="flex flex-wrap gap-4 ty-buttons">
                        <a href="/#contact" class="bg-white text-black px-8 py-3.5 rounded-full text-[13px] font-bold hover:scale-105 transition-transform">Let's Talk</a>
                        <a href="/" class="bg-white/10 backdrop-blur-md border border-white/20 text-white px-8 py-3.5 rounded-full text-[13px] font-bold hover:bg-white/20 transition-all">More Projects</a>
                    </div>
                </div>
                <div class="ty-icons flex gap-5 md:flex-col relative z-10">
                    <a href="#" class="w-14 h-14 bg-white/5 border border-white/10 rounded-full flex items-center justify-center font-bold text-[18px] hover:bg-white hover:text-black transition-all">in</a>
                    <a href="#" class="w-14 h-14 bg-white/5 border border-white/10 rounded-full flex items-center justify-center font-bold text-[18px] hover:bg-white hover:text-black transition-all">Bē</a>
                </div>
            </div>
        </section>
    </div>

    <footer class="py-[5vw] text-center border-t border-[#EEE]">
        <p class="text-[11px] text-[#888] tracking-widest uppercase">© 2026 Yadhu Sidharthan. All rights reserved.</p>
    </footer>

    <script src="/lib/motion.js"></script>
    <script>
        async function loadProject() {
            try {
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');
                if (!id) return;

                const [projRes, catRes] = await Promise.all([
                    fetch('/api/projects/' + id).catch(() => ({ ok: false })),
                    fetch('/api/categories').catch(() => ({ ok: false }))
                ]);
                
                if (!projRes.ok) {
                    document.getElementById('app').innerHTML = `<div class="global-padding py-20 text-center">Project not found.</div>`;
                    return;
                }

                const project = await projRes.json();
                const allCategories = catRes.ok ? await catRes.json() : [];
                
                const categoryNames = (project.categoryIds || []).map(cid => {
                    const c = allCategories.find(cat => cat.id === cid);
                    return c ? c.name : '';
                }).filter(n => n).join(', ') || 'Design';

                document.title = (project.title || 'Project') + ' | Yadhu Sidharthan';
                const blocks = [...(project.blocks || [])].sort((a,b) => a.order - b.order);
                const thankYouSection = document.getElementById('thank-you-section');
                if (thankYouSection) {
                    const card = thankYouSection.querySelector('.thank-you-card');
                    const overlay = thankYouSection.querySelector('.bg-black\\/40');
                    
                    if (project.cardBanner) {
                        card.style.setProperty('--card-banner', `url(${project.cardBanner})`);
                    }
                    if (project.cardOverlay) {
                        card.style.setProperty('--card-overlay', 'block');
                    }
                }

                const thankYouHTML = thankYouSection?.innerHTML || '';
                
                const contentHTML = `
                    <div class="global-padding pt-[10vw] pb-[2vw] reveal" id="hero-content">
                        <h1 class="text-[clamp(24px,4vw,55px)] font-bold leading-[1.1] tracking-tight mb-8 font-heading max-w-5xl">${project.title || 'Untitled'}</h1>
                        <p class="text-[#333] text-[clamp(16px,1.2vw,18px)] max-w-3xl leading-relaxed mb-[10vw] font-light">${project.description || ''}</p>
                    </div>
                    
                    <div class="flex flex-col gap-0 global-padding">
                        ${blocks.map(b => {
                            if (!b || (!b.content && b.type !== 'spacing' && b.type !== 'divider')) return '';
                            const radiusClass = (b.radiusTop ? 'rounded-t-[var(--radius-outer)]' : '') + ' ' + (b.radiusBottom ? 'rounded-b-[var(--radius-outer)]' : '');
                            const gapStyle = b.hasGap ? 'margin-top: 4vw; margin-bottom: 4vw;' : 'margin: 0;';
                            const content = b.content || '';
                            
                            if (b.type === 'image') return `<img src="${content}" class="w-full ${radiusClass} object-cover reveal" style="${gapStyle}">`;
                            if (b.type === 'video') return `<video src="${content}" class="w-full ${radiusClass} reveal" style="${gapStyle}" autoplay loop muted playsinline></video>`;
                            if (b.type === 'spacing') return `<div style="height: 4vw; min-height: 40px;"></div>`;
                            if (b.type === 'divider') return `<div class="global-padding"><hr class="border-[#E5E5E5] w-full"></div>`;
                            return `<div class="global-padding text-[clamp(16px,1.2vw,20px)] leading-[1.8] text-[#333] reveal" style="${gapStyle}">${content.replace(/\n/g,'<br>')}</div>`;
                        }).join('')}
                        
                        ${(project.images || []).map(img => {
                            return `<div class="w-full py-4"><img src="${img}" class="w-full rounded-[var(--radius-outer)] object-cover reveal" style="margin: 0;"></div>`;
                        }).join('')}
                    </div>
                    ${thankYouHTML}
                `;

                document.getElementById('app').innerHTML = contentHTML;

                // Animations removed as requested. Reveal everything immediately.
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
            } catch (e) {
                console.error(e);
                document.getElementById('app').innerHTML = `<div class="global-padding py-20 text-center">Error loading project.</div>`;
            }
        }
        loadProject();
    </script>
</body>
</html>
